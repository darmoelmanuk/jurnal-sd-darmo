<!DOCTYPE html>
<html>
<head>
    <title>Peminjaman Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h3 class="mb-4">📚 Sistem Peminjaman Buku</h3>

<div class="card p-4">
    <div class="mb-3">
        <label>ID User</label>
        <input type="text" id="id_user" class="form-control">
    </div>

    <div class="mb-3">
        <label>ID Buku</label>
        <input type="text" id="id_buku" class="form-control">
    </div>

    <button class="btn btn-primary" onclick="pinjamBuku()">Pinjam Buku</button>
</div>

<div id="notif" class="alert mt-3 d-none"></div>

<!-- Panggil JS -->
<script src="app.js"></script>

</body>
</html>
